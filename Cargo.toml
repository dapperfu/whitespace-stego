[workspace]
members = [
    "whitespace-stego-core",
    "whitespace-stego-cli", 
    "whitespace-stego-python",
    "whitespace-stego-backend",
    "rust",
    "wasi",
    "test_rust_binary",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DapperFu <dapperfu@example.com>"]
description = "Whitespace steganography using zero-width Unicode characters"
license = "MIT"
repository = "https://github.com/dapperfu/whitespace-stego"
keywords = ["steganography", "unicode", "whitespace", "cryptography"]
categories = ["cryptography", "text-processing"]

[workspace.dependencies]
base64 = "0.21.7"
fernet = "0.2.0"
thiserror = "1.0"
clap = { version = "4.5.1", features = ["derive"] }
pyo3 = { version = "0.21.0", features = ["extension-module"] }
maturin = "1.4"
proptest = "1.4"
criterion = "0.5"
test-case = "3.3"
indicatif = "0.17"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
tempfile = "3.8"
block-modes = "0.9"

[profile.release]
lto = true
codegen-units = 1 