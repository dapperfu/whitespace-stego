[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "whitespace-stego"
version = "0.1.0"
description = "Whitespace steganography tool with multiple backends"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "Faker",
    "pytest-benchmark>=4.0.0",
]

[project.scripts]
whitespace-stego = "whitespace_stego.cli:main"

[tool.setuptools]
packages = ["whitespace_stego"]

[tool.setuptools-rust]
rust-extension = "whitespace_stego_rs"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=whitespace_stego --cov-report=term-missing --html=report.html --self-contained-html"

[tool.coverage.run]
source = ["whitespace_stego"]

[tool.maturin]
python-source = "."
module-name = "whitespace_stego.rust_backend"
bindings = "pyo3" 