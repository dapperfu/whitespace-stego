[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "whitespace-stego-python"
version = "0.1.0"
description = "Python bindings for whitespace steganography using zero-width Unicode characters (Rust backend)"
authors = [
    { name = "DapperFu", email = "dapperfu@example.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
] 