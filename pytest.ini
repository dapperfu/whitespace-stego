[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --strict-markers -n auto --dist loadfile --max-worker-restart 3 --json-report --json-report-file=results/test_results.json
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Custom markers
markers =
    cli: marks tests as CLI tests (run sequentially)
    slow: marks tests as slow (should run separately)
    integration: marks tests as integration tests

# Parallelization strategy:
# - All tests except those marked 'cli' run in parallel
# - CLI tests (marked with @pytest.mark.cli) run sequentially
# See Makefile for automation. 