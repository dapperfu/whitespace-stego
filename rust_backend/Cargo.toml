[package]
name = "whitespace_stego_rs"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of whitespace steganography CLI tool"
authors = ["Your Name <your.email@example.com>"]

[[bin]]
name = "whitespace_stego_rs"
path = "src/main.rs"

[lib]
name = "whitespace_stego_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
base64 = "0.21"
aes-gcm = "0.10"
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"
pbkdf2 = { version = "0.12", features = ["simple"] } 