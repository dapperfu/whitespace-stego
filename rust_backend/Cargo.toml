[package]
name = "whitespace_stego_rs"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of whitespace steganography CLI tool"
authors = ["Your Name <your.email@example.com>"]

[[bin]]
name = "whitespace_stego_rs"
path = "src/main.rs"

[lib]
name = "whitespace_stego_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.19", features = ["extension-module"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"
pbkdf2 = "0.12"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] } 