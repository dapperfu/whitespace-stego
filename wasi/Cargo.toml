[package]
name = "whitespace-stego-wasi"
version = "0.1.0"
edition = "2021"
description = "Whitespace steganography WASI implementation"
license = "MIT"

[dependencies]
base64 = "0.21.7"
thiserror = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1 