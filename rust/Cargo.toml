[package]
name = "whitespace-stego"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
log = "0.4.20"
env_logger = "0.10.1"
base64 = "0.21.7"
fernet = "0.1.1"
sha2 = "0.10.8"
pyo3 = { version = "0.21", features = ["extension-module"] }
thiserror = "1.0"

[[bin]]
name = "whitespace-stego-rs"
path = "src/main.rs" 