name: 04 Make Python Binary Docker

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  make-python-binary-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Run make python-binary-docker
        run: |
          # Fix the Docker command in the Makefile temporarily for this run
          sed -i 's|/bin/cp|cp|g' Makefile
          make python-binary-docker

      - name: Verify Docker binary exists
        run: |
          if [ ! -f "dist/whitespace-stego-py" ]; then
            echo "❌ Docker Python binary not created"
            exit 1
          fi
          echo "✅ Docker Python binary created successfully"
          ls -la dist/whitespace-stego-py

      - name: Upload Docker Python binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-binary-docker
          path: dist/whitespace-stego-py
          retention-days: 7 