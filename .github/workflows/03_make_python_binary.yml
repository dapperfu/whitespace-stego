name: 03 Make Python Binary

on:
  workflow_run:
    workflows: ["01 Make Venv"]
    types:
      - completed
  workflow_dispatch:

jobs:
  make-python-binary:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Download venv artifact
        uses: actions/download-artifact@v4
        with:
          name: venv
          path: .venv/

      - name: Activate venv and run make python-binary
        run: |
          source .venv/bin/activate
          make python-binary

      - name: Verify binary exists
        run: |
          if [ ! -f "bin/whitespace-stego-py" ]; then
            echo "❌ Python binary not created"
            exit 1
          fi
          echo "✅ Python binary created successfully"
          ls -la bin/whitespace-stego-py

      - name: Upload Python binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-binary
          path: bin/whitespace-stego-py
          retention-days: 7 