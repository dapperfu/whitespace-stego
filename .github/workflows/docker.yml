name: Docker Build and Test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  schedule:
    # Run weekly to ensure Docker image still works
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      docker_action:
        description: 'Docker action to perform'
        required: true
        default: 'build-test'
        type: choice
        options:
          - build-test
          - build-push
          - test-only

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test Docker image
  build-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    if: github.event.inputs.docker_action == 'build-test' || github.event.inputs.docker_action == 'build-push' || github.event.inputs.docker_action == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event.inputs.docker_action == 'build-push' || github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.docker_action == 'build-push' || github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image functionality
        run: |
          # Build local image for testing
          docker build -t whitespace-stego:test .
          
          echo "=== Testing Docker Image ==="
          
          # Test Python package import
          echo "Testing Python package import..."
          docker run --rm whitespace-stego:test python -c "
          import whitespace_stego
          print('✓ Python package imported successfully')
          
          # Test backends
          try:
              import whitespace_stego_rust
              print('✓ Rust backend available')
          except ImportError:
              print('⚠ Rust backend not available')
          
          try:
              import whitespace_stego.c_backend
              print('✓ C backend available')
          except ImportError:
              print('⚠ C backend not available')
          "
          
          # Test CLI functionality
          echo "Testing CLI functionality..."
          echo "Hello World from Docker" > /tmp/docker_test_message.txt
          echo "This is a carrier file for Docker testing." > /tmp/docker_test_carrier.txt
          
          # Test encode
          docker run --rm -v /tmp:/tmp whitespace-stego:test python -m whitespace_stego.cli encode \
            --message-file /tmp/docker_test_message.txt \
            --carrier-file /tmp/docker_test_carrier.txt \
            --output-file /tmp/docker_test_encoded.txt
          
          # Test decode
          docker run --rm -v /tmp:/tmp whitespace-stego:test python -m whitespace_stego.cli decode \
            --carrier-file /tmp/docker_test_encoded.txt \
            --output-file /tmp/docker_test_decoded.txt
          
          # Verify roundtrip
          echo "Original: $(cat /tmp/docker_test_message.txt)"
          echo "Decoded: $(cat /tmp/docker_test_decoded.txt)"
          
          if diff /tmp/docker_test_message.txt /tmp/docker_test_decoded.txt; then
            echo "✓ Docker CLI roundtrip test passed"
          else
            echo "❌ Docker CLI roundtrip test failed"
            exit 1
          fi
          
          # Test password protection
          echo "Testing password protection..."
          docker run --rm -v /tmp:/tmp whitespace-stego:test python -m whitespace_stego.cli encode \
            --message-file /tmp/docker_test_message.txt \
            --carrier-file /tmp/docker_test_carrier.txt \
            --output-file /tmp/docker_test_encoded_pw.txt \
            --password "testpassword123"
          
          docker run --rm -v /tmp:/tmp whitespace-stego:test python -m whitespace_stego.cli decode \
            --carrier-file /tmp/docker_test_encoded_pw.txt \
            --output-file /tmp/docker_test_decoded_pw.txt \
            --password "testpassword123"
          
          if diff /tmp/docker_test_message.txt /tmp/docker_test_decoded_pw.txt; then
            echo "✓ Docker password protection test passed"
          else
            echo "❌ Docker password protection test failed"
            exit 1
          fi
          
          # Test wrong password rejection
          if docker run --rm -v /tmp:/tmp whitespace-stego:test python -m whitespace_stego.cli decode \
            --carrier-file /tmp/docker_test_encoded_pw.txt \
            --output-file /tmp/docker_test_wrong_pw.txt \
            --password "wrongpassword" 2>&1 | grep -q "error\|Error\|failed\|Failed"; then
            echo "✓ Docker wrong password rejection test passed"
          else
            echo "❌ Docker wrong password rejection test failed"
            exit 1
          fi

      - name: Test Docker image size
        run: |
          echo "=== Docker Image Analysis ==="
          
          # Get image size
          IMAGE_SIZE=$(docker images whitespace-stego:test --format "table {{.Size}}" | tail -n 1)
          echo "Image size: $IMAGE_SIZE"
          
          # Extract size in MB
          SIZE_MB=$(echo $IMAGE_SIZE | sed 's/MB//' | sed 's/GB/*1024/' | bc -l 2>/dev/null || echo "unknown")
          echo "Size in MB: $SIZE_MB"
          
          # Check if size is reasonable (less than 1GB)
          if [[ "$SIZE_MB" != "unknown" ]] && (( $(echo "$SIZE_MB < 1024" | bc -l) )); then
            echo "✓ Image size is reasonable"
          else
            echo "⚠ Image size might be large: $IMAGE_SIZE"
          fi
          
          # Show image layers
          echo "Image layers:"
          docker history whitespace-stego:test --format "table {{.CreatedBy}}\t{{.Size}}"

      - name: Test Docker image security
        run: |
          echo "=== Docker Security Scan ==="
          
          # Check for known vulnerabilities (if trivy is available)
          if command -v trivy &> /dev/null; then
            echo "Running Trivy security scan..."
            trivy image whitespace-stego:test --severity HIGH,CRITICAL --exit-code 0 || echo "⚠ Security vulnerabilities found (non-blocking)"
          else
            echo "Trivy not available, skipping security scan"
          fi
          
          # Check for root user
          USER=$(docker run --rm whitespace-stego:test whoami)
          if [[ "$USER" == "root" ]]; then
            echo "⚠ Container runs as root (consider using non-root user)"
          else
            echo "✓ Container runs as non-root user: $USER"
          fi

  # Test Docker image with different scenarios
  docker-test-scenarios:
    name: Docker Test Scenarios
    runs-on: ubuntu-latest
    if: github.event.inputs.docker_action == 'test-only' || github.event.inputs.docker_action == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t whitespace-stego:test .

      - name: Test different file types
        run: |
          echo "=== Testing Different File Types ==="
          
          # Test with binary file
          echo "Testing with binary file..."
          head -c 1000 /dev/urandom > /tmp/binary_test.bin
          echo "Carrier text for binary test" > /tmp/binary_carrier.txt
          
          docker run --rm -v /tmp:/tmp whitespace-stego:test python -m whitespace_stego.cli encode \
            --message-file /tmp/binary_test.bin \
            --carrier-file /tmp/binary_carrier.txt \
            --output-file /tmp/binary_encoded.txt
          
          docker run --rm -v /tmp:/tmp whitespace-stego:test python -m whitespace_stego.cli decode \
            --carrier-file /tmp/binary_encoded.txt \
            --output-file /tmp/binary_decoded.bin
          
          if diff /tmp/binary_test.bin /tmp/binary_decoded.bin; then
            echo "✓ Binary file test passed"
          else
            echo "❌ Binary file test failed"
            exit 1
          fi
          
          # Test with large text file
          echo "Testing with large text file..."
          for i in {1..100}; do
            echo "Line $i: This is a test message for Docker testing with whitespace steganography." >> /tmp/large_test.txt
          done
          echo "Carrier text for large file test" > /tmp/large_carrier.txt
          
          docker run --rm -v /tmp:/tmp whitespace-stego:test python -m whitespace_stego.cli encode \
            --message-file /tmp/large_test.txt \
            --carrier-file /tmp/large_carrier.txt \
            --output-file /tmp/large_encoded.txt
          
          docker run --rm -v /tmp:/tmp whitespace-stego:test python -m whitespace_stego.cli decode \
            --carrier-file /tmp/large_encoded.txt \
            --output-file /tmp/large_decoded.txt
          
          if diff /tmp/large_test.txt /tmp/large_decoded.txt; then
            echo "✓ Large file test passed"
          else
            echo "❌ Large file test failed"
            exit 1
          fi

      - name: Test Docker networking
        run: |
          echo "=== Testing Docker Networking ==="
          
          # Test that container can access network (for potential future features)
          if docker run --rm whitespace-stego:test python -c "import urllib.request; print('✓ Network access available')" 2>/dev/null; then
            echo "✓ Container has network access"
          else
            echo "⚠ Container network access limited"
          fi

      - name: Test Docker resource limits
        run: |
          echo "=== Testing Docker Resource Limits ==="
          
          # Test with memory limit
          if docker run --rm --memory=512m whitespace-stego:test python -c "import whitespace_stego; print('✓ Works with memory limit')"; then
            echo "✓ Container works with memory limits"
          else
            echo "❌ Container failed with memory limits"
            exit 1
          fi
          
          # Test with CPU limit
          if docker run --rm --cpus=1.0 whitespace-stego:test python -c "import whitespace_stego; print('✓ Works with CPU limit')"; then
            echo "✓ Container works with CPU limits"
          else
            echo "❌ Container failed with CPU limits"
            exit 1
          fi

  # Docker image optimization
  docker-optimize:
    name: Docker Image Optimization
    runs-on: ubuntu-latest
    if: github.event.inputs.docker_action == 'build-push' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build optimized image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Generate Docker report
        run: |
          echo "=== Docker Build Report ==="
          echo "Repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tags: latest, ${{ github.sha }}"
          echo "Platforms: linux/amd64, linux/arm64"
          echo "Build completed successfully"
          echo ""
          echo "Image available at:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # Final summary
  docker-summary:
    name: Docker Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [build-test, docker-test-scenarios, docker-optimize]
    steps:
      - name: Generate Docker summary
        run: |
          echo "=== Docker Build and Test Summary ==="
          echo ""
          echo "Build Results:"
          echo "  Build and Test: ${{ needs.build-test.result }}"
          echo "  Test Scenarios: ${{ needs.docker-test-scenarios.result }}"
          echo "  Optimization: ${{ needs.docker-optimize.result }}"
          echo ""
          
          # Count successful and failed jobs
          SUCCESS_COUNT=0
          FAILED_COUNT=0
          
          for job in "build-test" "docker-test-scenarios" "docker-optimize"; do
            if [[ "${{ needs[needs.job].result }}" == "success" ]]; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            elif [[ "${{ needs[needs.job].result }}" == "failure" ]]; then
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done
          
          echo "Summary: $SUCCESS_COUNT successful, $FAILED_COUNT failed"
          echo ""
          
          if [[ $FAILED_COUNT -eq 0 ]]; then
            echo "🎉 All Docker builds and tests passed successfully!"
            echo "✅ Docker image is ready for deployment"
            echo "✅ All functionality tested in containerized environment"
            echo "✅ Security and performance validated"
            exit 0
          else
            echo "❌ Some Docker builds or tests failed. Check individual job results for details."
            exit 1
          fi 