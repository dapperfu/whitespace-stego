name: Python Tests and Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily to ensure tests still pass
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - cli
          - coverage
          - quick

env:
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'unit' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'quick'
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/test_core.py -v --tb=short

      - name: Run data tests
        run: |
          pytest tests/test_data.py -v --tb=short

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'integration' || github.event.inputs.test_type == 'all'
    strategy:
      matrix:
        python-version: ['3.11']
        backend: ['python', 'rust', 'c']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Install Rust backend (if needed)
        if: matrix.backend == 'rust'
        run: |
          pip install whitespace-stego-backend

      - name: Run integration tests
        run: |
          pytest tests/test_in_memory_roundtrip.py -v --tb=short

      - name: Run backend-specific tests
        run: |
          BACKEND=${{ matrix.backend }} pytest tests/test_cli_and_api_coverage.py -v --tb=short

  # CLI tests
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'cli' || github.event.inputs.test_type == 'all'
    strategy:
      matrix:
        python-version: ['3.11']
        test-suite: ['simple', 'comprehensive', 'error', 'missing_lines']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run CLI tests
        run: |
          pytest tests/test_cli_${{ matrix.test-suite }}_coverage.py -v --tb=short

  # Comprehensive test suite
  comprehensive-tests:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'all'
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run all tests
        run: |
          pytest tests/ -v --tb=short --maxfail=10

      - name: Run consistency tests
        run: |
          python test_cli_consistency.py

      - name: Run everything test
        run: |
          python test_everything.py

  # Coverage tests
  coverage-tests:
    name: Coverage Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'coverage' || github.event.inputs.test_type == 'all'
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run coverage tests
        run: |
          pytest tests/test_coverage_gaps.py -v --tb=short

      - name: Run C implementation coverage
        run: |
          pytest tests/test_c_implementation_coverage.py -v --tb=short

      - name: Generate coverage report
        run: |
          pytest --cov=whitespace_stego --cov-report=html --cov-report=xml tests/
          coverage report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Quick tests (for PR validation)
  quick-tests:
    name: Quick Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'quick' || github.event.inputs.test_type == ''
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run quick test suite
        run: |
          pytest tests/test_core.py tests/test_data.py -v --tb=short --maxfail=5

      - name: Run basic CLI tests
        run: |
          pytest tests/test_cli_simple_coverage.py -v --tb=short

  # WASM website tests (if server is available)
  wasm-website-tests:
    name: WASM Website Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'all'
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Start WASM server
        run: |
          cd wasi
          python -m http.server 8000 &
          sleep 5

      - name: Run WASM website tests
        run: |
          pytest tests/test_wasm_website.py -v --tb=short
        continue-on-error: true

  # Test summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    if: always() && (github.event.inputs.test_type == 'all' || github.event.inputs.test_type == '')
    needs: [unit-tests, integration-tests, cli-tests, comprehensive-tests, coverage-tests, quick-tests, wasm-website-tests]
    steps:
      - name: Generate test summary
        run: |
          echo "=== Test Summary ==="
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "CLI Tests: ${{ needs.cli-tests.result }}"
          echo "Comprehensive Tests: ${{ needs.comprehensive-tests.result }}"
          echo "Coverage Tests: ${{ needs.coverage-tests.result }}"
          echo "Quick Tests: ${{ needs.quick-tests.result }}"
          echo "WASM Website Tests: ${{ needs.wasm-website-tests.result }}"
          
          if [[ "${{ needs.unit-tests.result }}" == "success" && 
                "${{ needs.integration-tests.result }}" == "success" && 
                "${{ needs.cli-tests.result }}" == "success" && 
                "${{ needs.comprehensive-tests.result }}" == "success" && 
                "${{ needs.coverage-tests.result }}" == "success" && 
                "${{ needs.quick-tests.result }}" == "success" ]]; then
            echo "✅ All critical tests passed!"
            exit 0
          else
            echo "❌ Some tests failed. Check individual job results for details."
            exit 1
          fi 