name: 05 Make Rust

on:
  workflow_run:
    workflows: ["01 Make Venv"]
    types:
      - completed
  workflow_dispatch:

jobs:
  make-rust:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: '1.75'
          override: true

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Download venv artifact
        uses: actions/download-artifact@v4
        with:
          name: venv
          path: .venv/

      - name: Activate venv and run make rust
        run: |
          source .venv/bin/activate
          make rust

      - name: Verify Rust binary exists
        run: |
          if [ ! -f "bin/whitespace-stego-rs" ]; then
            echo "❌ Rust binary not created"
            exit 1
          fi
          echo "✅ Rust binary created successfully"
          ls -la bin/whitespace-stego-rs

      - name: Upload Rust binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary
          path: bin/whitespace-stego-rs
          retention-days: 7 