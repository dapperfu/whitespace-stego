name: Nightly Binaries

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if no changes'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  RUST_VERSION: '1.75'
  GO_VERSION: '1.21'

jobs:
  # Build all implementations
  build-binaries:
    name: Build All Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install cmake pkg-config openssl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Build Python implementation
        run: |
          # Build Rust backend
          cd whitespace-stego-python
          pip install maturin
          maturin build --release
          cd ..
          
          # Build C backend (Linux/macOS only)
          if [[ "${{ matrix.platform }}" != "windows-latest" ]]; then
            cd c
            make clean
            make
            cd ..
          fi
          
          # Build Go implementation
          cd go
          make clean
          make
          cd ..
          
          # Build compiled binary
          pip install pyinstaller
          pyinstaller --onefile --name whitespace-stego-cli-${{ matrix.platform }} whitespace_stego_main.py
          cp dist/whitespace-stego-cli-${{ matrix.platform }} bin/
          chmod +x bin/whitespace-stego-cli-${{ matrix.platform }}

      - name: Build Rust implementation
        run: |
          cd whitespace-stego-core
          cargo build --release
          cd ..
          cd whitespace-stego-cli
          cargo build --release
          cp target/release/whitespace-stego-rs ../bin/whitespace-stego-rs-${{ matrix.platform }}
          cd ..

      - name: Build C implementation
        if: matrix.platform != 'windows-latest'
        run: |
          cd c
          make clean
          make
          cp bin/whitespace-stego-c ../bin/whitespace-stego-c-${{ matrix.platform }}
          cd ..

      - name: Build Go implementation
        run: |
          cd go
          make clean
          make
          cp bin/whitespace-stego-go ../bin/whitespace-stego-go-${{ matrix.platform }}
          cd ..

      - name: Verify binaries
        run: |
          echo "=== Built Binaries for ${{ matrix.platform }} ==="
          ls -la bin/
          
          # Test each binary
          for binary in bin/*; do
            if [[ -f "$binary" ]]; then
              echo "Testing $binary..."
              if [[ "$binary" == *"whitespace-stego-cli"* ]]; then
                $binary --help > /dev/null 2>&1 || echo "  ⚠ CLI binary test failed"
              elif [[ "$binary" == *"whitespace-stego-rs"* ]]; then
                $binary --help > /dev/null 2>&1 || echo "  ⚠ Rust binary test failed"
              elif [[ "$binary" == *"whitespace-stego-c"* ]]; then
                $binary --help > /dev/null 2>&1 || echo "  ⚠ C binary test failed"
              elif [[ "$binary" == *"whitespace-stego-go"* ]]; then
                $binary --help > /dev/null 2>&1 || echo "  ⚠ Go binary test failed"
              fi
            fi
          done

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.platform }}
          path: bin/
          retention-days: 7

  # Create nightly release
  create-nightly-release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v3
        with:
          path: binaries/

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run quick test
        run: |
          # Test that binaries work
          echo "=== Testing Binaries ==="
          
          # Find a binary to test
          for platform in ubuntu-latest windows-latest macos-latest; do
            if [[ -d "binaries/binaries-$platform" ]]; then
              echo "Testing $platform binaries..."
              cd binaries/binaries-$platform
              
              # Test Python CLI
              if [[ -f "whitespace-stego-cli-$platform" ]]; then
                echo "Testing Python CLI..."
                ./whitespace-stego-cli-$platform --help > /dev/null 2>&1 || echo "  ⚠ Python CLI test failed"
              fi
              
              # Test Rust CLI
              if [[ -f "whitespace-stego-rs-$platform" ]]; then
                echo "Testing Rust CLI..."
                ./whitespace-stego-rs-$platform --help > /dev/null 2>&1 || echo "  ⚠ Rust CLI test failed"
              fi
              
              # Test Go CLI
              if [[ -f "whitespace-stego-go-$platform" ]]; then
                echo "Testing Go CLI..."
                ./whitespace-stego-go-$platform --help > /dev/null 2>&1 || echo "  ⚠ Go CLI test failed"
              fi
              
              # Test C CLI
              if [[ -f "whitespace-stego-c-$platform" ]]; then
                echo "Testing C CLI..."
                ./whitespace-stego-c-$platform --help > /dev/null 2>&1 || echo "  ⚠ C CLI test failed"
              fi
              
              cd ../..
              break
            fi
          done

      - name: Create release notes
        id: release_notes
        run: |
          # Get current date
          DATE=$(date -u +"%Y-%m-%d")
          TIME=$(date -u +"%H:%M:%S UTC")
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          
          # Count binaries
          BINARY_COUNT=0
          for platform in ubuntu-latest windows-latest macos-latest; do
            if [[ -d "binaries/binaries-$platform" ]]; then
              COUNT=$(ls binaries/binaries-$platform/* 2>/dev/null | wc -l)
              BINARY_COUNT=$((BINARY_COUNT + COUNT))
            fi
          done
          
          # Generate release notes
          cat > release_notes.md << EOF
          # Nightly Build - $DATE
          
          **Build Time:** $TIME  
          **Commit:** $COMMIT_SHORT  
          **Total Binaries:** $BINARY_COUNT
          
          ## 📦 What's Included
          
          This nightly build includes compiled binaries for all implementations:
          
          - **Python Implementation**: PyInstaller-compiled standalone binaries
          - **Rust Implementation**: High-performance Rust CLI binaries
          - **C Implementation**: Lightweight C binaries (Linux/macOS only)
          - **Go Implementation**: Go binaries with full feature parity
          
          ## 🖥️ Supported Platforms
          
          - **Linux (Ubuntu)**: All implementations available
          - **macOS**: All implementations available
          - **Windows**: Python, Rust, and Go implementations available
          
          ## 📋 Installation
          
          ### Linux/macOS
          
          \`\`\`bash
          # Download the appropriate binary for your platform
          chmod +x whitespace-stego-*
          ./whitespace-stego-* --help
          \`\`\`
          
          ### Windows
          
          \`\`\`cmd
          # Download the appropriate binary for your platform
          whitespace-stego-*.exe --help
          \`\`\`
          
          ## 🔧 Features
          
          - ✅ Full cross-implementation compatibility
          - ✅ Password-protected messages
          - ✅ Multiple message support
          - ✅ Binary file support
          - ✅ All advanced features included
          
          ## 🧪 Testing
          
          All binaries have been tested for basic functionality. For comprehensive testing, see the main repository.
          
          ## 📝 Notes
          
          - These are nightly builds and may contain experimental features
          - For production use, consider using the latest stable release
          - Report any issues on the GitHub repository
          
          ---
          
          *Auto-generated on $DATE at $TIME*
          EOF
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or update nightly release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.sha }}
          release_name: Nightly Build - $(date -u +"%Y-%m-%d")
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: true

      - name: Upload binaries to release
        run: |
          # Upload all binaries to the release
          for platform in ubuntu-latest windows-latest macos-latest; do
            if [[ -d "binaries/binaries-$platform" ]]; then
              echo "Uploading $platform binaries..."
              cd binaries/binaries-$platform
              
              for binary in *; do
                if [[ -f "$binary" ]]; then
                  echo "Uploading $binary..."
                  gh release upload nightly-${{ github.sha }} "$binary" --clobber
                fi
              done
              
              cd ../..
            fi
          done

      - name: Clean up old nightly releases
        run: |
          # Keep only the last 5 nightly releases
          echo "Cleaning up old nightly releases..."
          
          # Get list of nightly releases (excluding the current one)
          gh release list --limit 100 | grep "nightly-" | grep -v "nightly-${{ github.sha }}" | head -n 5 | while read -r line; do
            TAG=$(echo "$line" | awk '{print $1}')
            echo "Deleting old nightly release: $TAG"
            gh release delete "$TAG" --yes
            git push origin --delete "$TAG" 2>/dev/null || true
          done

      - name: Generate release summary
        run: |
          echo "=== Nightly Release Summary ==="
          echo ""
          echo "Release: nightly-${{ github.sha }}"
          echo "Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo ""
          
          # Count uploaded binaries
          UPLOADED_COUNT=0
          for platform in ubuntu-latest windows-latest macos-latest; do
            if [[ -d "binaries/binaries-$platform" ]]; then
              COUNT=$(ls binaries/binaries-$platform/* 2>/dev/null | wc -l)
              UPLOADED_COUNT=$((UPLOADED_COUNT + COUNT))
              echo "$platform: $COUNT binaries"
            fi
          done
          
          echo ""
          echo "Total binaries uploaded: $UPLOADED_COUNT"
          echo ""
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/nightly-${{ github.sha }}"
          echo ""
          echo "🎉 Nightly release created successfully!" 