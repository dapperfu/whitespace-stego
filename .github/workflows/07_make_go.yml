name: 07 Make Go

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  make-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Run make go
        run: make go

      - name: Verify Go binary exists
        run: |
          if [ ! -f "bin/whitespace-stego-go" ]; then
            echo "❌ Go binary not created"
            exit 1
          fi
          echo "✅ Go binary created successfully"
          ls -la bin/whitespace-stego-go

      - name: Upload Go binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-binary
          path: bin/whitespace-stego-go
          retention-days: 7 