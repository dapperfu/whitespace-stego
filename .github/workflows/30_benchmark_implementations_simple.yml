name: Benchmark Implementations Simple (3X)

on:
  push:
    branches: [ main, implementation5 ]
    paths:
      - 'scripts/benchmark_implementations_simple.sh'
  pull_request:
    branches: [ main, implementation5 ]
    paths:
      - 'scripts/benchmark_implementations_simple.sh'
  workflow_dispatch:

jobs:
  benchmark-simple:
    name: Benchmark Simple (3X)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup all environments
        run: |
          # Setup Rust
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
          
          # Setup Go
          wget https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          
          # Setup C
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make libssl-dev bc
          
      - name: Build implementations
        run: |
          echo "🔨 Building implementations for simple benchmark..."
          
          # Build Rust
          cd implementations/rust && cargo build --release
          
          # Build Go
          cd ../go && make build
          
      - name: Run simple benchmark (3X)
        run: |
          echo "📊 Running simple benchmark (3X)..."
          chmod +x scripts/benchmark_implementations_simple.sh
          
          for i in {1..3}; do
            echo "=== Benchmark run $i/3 ==="
            ./scripts/benchmark_implementations_simple.sh
            echo "=== Benchmark run $i/3 completed ==="
            echo
          done
          
      - name: Display results
        run: |
          echo "📈 Simple Benchmark Results:"
          echo "============================"
          if [ -f benchmark_results/benchmark_simple.log ]; then
            cat benchmark_results/benchmark_simple.log
          fi 