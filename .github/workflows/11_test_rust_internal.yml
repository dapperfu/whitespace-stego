name: Test Rust Internal

on:
  push:
    branches: [ main, implementation5 ]
    paths:
      - 'implementations/rust/**'
      - 'implementations/python/whitespace-stego-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main, implementation5 ]
    paths:
      - 'implementations/rust/**'
      - 'implementations/python/whitespace-stego-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

jobs:
  test-rust:
    name: Test Rust Implementation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
            
      - name: Install dependencies
        run: |
          cd implementations/rust
          cargo fetch
          cd ../python/whitespace-stego-core
          cargo fetch
          
      - name: Run Rust CLI tests
        run: |
          echo "🧪 Testing Rust CLI implementation..."
          cd implementations/rust
          cargo test --verbose
          
      - name: Run Rust core library tests
        run: |
          echo "🧪 Testing Rust core library..."
          cd implementations/python/whitespace-stego-core
          cargo test --verbose
          
      - name: Run Rust integration tests
        run: |
          echo "🧪 Testing Rust integration tests..."
          cd implementations/python/whitespace-stego-core
          cargo test --test integration_tests --verbose
          
      - name: Run Rust property tests
        run: |
          echo "🧪 Testing Rust property tests..."
          cd implementations/python/whitespace-stego-core
          cargo test --test test_core_prop --verbose
          
      - name: Run Rust benchmarks
        run: |
          echo "🏃 Running Rust benchmarks..."
          cd implementations/python/whitespace-stego-core
          cargo bench --no-run
          
      - name: Check Rust code formatting
        run: |
          echo "🎨 Checking Rust code formatting..."
          cd implementations/rust
          cargo fmt -- --check
          cd ../python/whitespace-stego-core
          cargo fmt -- --check
          
      - name: Run Rust clippy
        run: |
          echo "🔍 Running Rust clippy..."
          cd implementations/rust
          cargo clippy -- -D warnings
          cd ../python/whitespace-stego-core
          cargo clippy -- -D warnings
          
      - name: Build Rust release binaries
        run: |
          echo "🔨 Building Rust release binaries..."
          cd implementations/rust
          cargo build --release
          cd ../python/whitespace-stego-core
          cargo build --release
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rust-test-results
          path: |
            implementations/rust/target/test-results/
            implementations/python/whitespace-stego-core/target/test-results/
          retention-days: 7 