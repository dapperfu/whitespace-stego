name: Advanced Docker Tests and Edge Cases

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly for comprehensive testing
    - cron: '0 3 * * 1'

env:
  DOCKER_BUILDKIT: 1

jobs:
  # Advanced Docker Compose scenarios
  docker-compose-mixed-profiles:
    name: Mixed Docker Compose Profiles
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile-combination:
          - ["python", "rust"]
          - ["python", "c"]
          - ["rust", "c"]
          - ["python", "jupyter"]
          - ["rust", "test"]
          - ["c", "compatibility"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mixed profiles
        run: |
          docker-compose -f docker-compose.individual.yml --profile ${{ join(matrix.profile-combination, ' --profile ') }} build

      - name: Test mixed profiles
        run: |
          docker-compose -f docker-compose.individual.yml --profile ${{ join(matrix.profile-combination, ' --profile ') }} up --abort-on-container-exit

  # Docker build with different build arguments
  docker-build-args:
    name: Docker Build with Arguments
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile.python, Dockerfile.rust, Dockerfile.c]
        build-arg:
          - BUILD_ENV=development
          - BUILD_ENV=production
          - BUILD_ENV=test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with arguments
        run: |
          docker build -f ${{ matrix.dockerfile }} \
            --build-arg BUILD_ENV=${{ matrix.build-arg }} \
            -t whitespace-stego-${{ matrix.build-arg }} .

      - name: Test build
        run: |
          if [ "${{ matrix.dockerfile }}" = "Dockerfile.python" ]; then
            docker run --rm whitespace-stego-${{ matrix.build-arg }} python -m whitespace_stego.cli --help
          elif [ "${{ matrix.dockerfile }}" = "Dockerfile.rust" ]; then
            docker run --rm whitespace-stego-${{ matrix.build-arg }} whitespace-stego-rs --help
          else
            docker run --rm whitespace-stego-${{ matrix.build-arg }} whitespace-stego --help
          fi

  # Multi-platform builds
  multi-platform-builds:
    name: Multi-Platform Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        dockerfile: [Dockerfile.python, Dockerfile.rust, Dockerfile.c]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-platform
        run: |
          docker buildx build --platform ${{ matrix.platform }} \
            -f ${{ matrix.dockerfile }} \
            -t whitespace-stego-${{ matrix.platform }}:${{ matrix.dockerfile }} .

  # Docker layer caching and optimization
  docker-layer-caching:
    name: Docker Layer Caching
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with layer caching
        run: |
          docker buildx build --cache-from type=gha --cache-to type=gha,mode=max \
            -f Dockerfile.python -t whitespace-stego-cached .

      - name: Test cached build
        run: |
          docker run --rm whitespace-stego-cached python -m whitespace_stego.cli --help

  # Docker Compose with custom networks
  docker-compose-networks:
    name: Docker Compose with Custom Networks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create custom network
        run: docker network create stego-test-network

      - name: Build and run with custom network
        run: |
          docker-compose -f docker-compose.individual.yml --profile python build
          docker-compose -f docker-compose.individual.yml --profile python \
            --project-name stego-test \
            --project-directory . \
            up --abort-on-container-exit

      - name: Cleanup network
        run: docker network rm stego-test-network || true

  # Docker volume persistence tests
  docker-volume-tests:
    name: Docker Volume Persistence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker build -f Dockerfile.python -t whitespace-stego-python .
          docker build -f Dockerfile.rust -t whitespace-stego-rust .
          docker build -f Dockerfile.c -t whitespace-stego-c .

      - name: Create test data
        run: |
          mkdir -p test-data
          echo "Test message" > test-data/message.txt
          echo "Carrier text" > test-data/carrier.txt

      - name: Test volume persistence
        run: |
          # Test Python volume persistence
          docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-python \
            python -m whitespace_stego.cli encode \
            --message-file /app/data/message.txt \
            --carrier-file /app/data/carrier.txt \
            --output /app/data/encoded_python.txt
          
          # Verify file was created
          test -f test-data/encoded_python.txt

      - name: Test cross-container volume access
        run: |
          # Test Rust can read Python's output
          docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-rust \
            whitespace-stego-rs decode \
            --cf /app/data/encoded_python.txt \
            -o /app/data/decoded_rust.txt
          
          # Verify decoding worked
          diff test-data/message.txt test-data/decoded_rust.txt

      - name: Cleanup test data
        run: rm -rf test-data

  # Docker resource limits and constraints
  docker-resource-limits:
    name: Docker Resource Limits
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile.python, Dockerfile.rust, Dockerfile.c]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} -t whitespace-stego-resource-test .

      - name: Test with memory limits
        run: |
          docker run --rm --memory=512m --memory-swap=1g whitespace-stego-resource-test \
            ${{ matrix.dockerfile == 'Dockerfile.python' && 'python -m whitespace_stego.cli --help' || 
                matrix.dockerfile == 'Dockerfile.rust' && 'whitespace-stego-rs --help' || 
                'whitespace-stego --help' }}

      - name: Test with CPU limits
        run: |
          docker run --rm --cpus=0.5 whitespace-stego-resource-test \
            ${{ matrix.dockerfile == 'Dockerfile.python' && 'python -m whitespace_stego.cli --help' || 
                matrix.dockerfile == 'Dockerfile.rust' && 'whitespace-stego-rs --help' || 
                'whitespace-stego --help' }}

  # Docker health checks
  docker-health-checks:
    name: Docker Health Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images with health checks
        run: |
          # Create a temporary Dockerfile with health check
          cat > Dockerfile.health << 'EOF'
          FROM whitespace-stego-python:latest
          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD python -m whitespace_stego.cli --help || exit 1
          EOF
          
          docker build -f Dockerfile.health -t whitespace-stego-health .

      - name: Test health check
        run: |
          docker run -d --name health-test whitespace-stego-health
          sleep 10
          docker ps
          docker inspect health-test | grep -A 10 "Health"

      - name: Cleanup
        run: |
          docker stop health-test || true
          docker rm health-test || true

  # Docker Compose with environment variables
  docker-compose-env-vars:
    name: Docker Compose Environment Variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test with custom environment
        run: |
          PYTHONPATH=/custom/path RUST_BACKTRACE=1 \
          docker-compose -f docker-compose.individual.yml --profile python build
          
          PYTHONPATH=/custom/path RUST_BACKTRACE=1 \
          docker-compose -f docker-compose.individual.yml --profile python up --abort-on-container-exit

  # Docker Compose with custom configs
  docker-compose-custom-config:
    name: Docker Compose Custom Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create custom compose file
        run: |
          cat > docker-compose.custom.yml << 'EOF'
          version: '3.8'
          services:
            custom-python:
              build:
                context: .
                dockerfile: Dockerfile.python
              environment:
                - CUSTOM_VAR=test_value
                - PYTHONPATH=/app
              volumes:
                - ./data:/app/data
              profiles:
                - custom
          EOF

      - name: Test custom configuration
        run: |
          docker-compose -f docker-compose.custom.yml --profile custom build
          docker-compose -f docker-compose.custom.yml --profile custom up --abort-on-container-exit

  # Docker Compose with secrets
  docker-compose-secrets:
    name: Docker Compose Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test secret
        run: echo "test_secret_value" | docker secret create test_secret -

      - name: Create compose file with secrets
        run: |
          cat > docker-compose.secrets.yml << 'EOF'
          version: '3.8'
          services:
            secret-test:
              build:
                context: .
                dockerfile: Dockerfile.python
              secrets:
                - test_secret
              profiles:
                - secrets
          secrets:
            test_secret:
              external: true
          EOF

      - name: Test with secrets
        run: |
          docker-compose -f docker-compose.secrets.yml --profile secrets build
          docker-compose -f docker-compose.secrets.yml --profile secrets up --abort-on-container-exit

      - name: Cleanup secrets
        run: docker secret rm test_secret || true

  # Docker Compose with multiple compose files
  docker-compose-multiple-files:
    name: Docker Compose Multiple Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create additional compose file
        run: |
          cat > docker-compose.override.yml << 'EOF'
          version: '3.8'
          services:
            python-stego:
              environment:
                - OVERRIDE_VAR=override_value
          EOF

      - name: Test with multiple compose files
        run: |
          docker-compose -f docker-compose.individual.yml -f docker-compose.override.yml --profile python build
          docker-compose -f docker-compose.individual.yml -f docker-compose.override.yml --profile python up --abort-on-container-exit

      - name: Cleanup override file
        run: rm -f docker-compose.override.yml

  # Docker Compose with different compose versions
  docker-compose-versions:
    name: Docker Compose Versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compose-version: ['3.7', '33.8', '3.9']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create version-specific compose file
        run: |
          cat > docker-compose.v${{ matrix.compose-version }}.yml << 'EOF'
          version: '${{ matrix.compose-version }}'
          services:
            version-test:
              build:
                context: .
                dockerfile: Dockerfile.python
              profiles:
                - version-test
          EOF

      - name: Test compose version
        run: |
          docker-compose -f docker-compose.v${{ matrix.compose-version }}.yml --profile version-test build
          docker-compose -f docker-compose.v${{ matrix.compose-version }}.yml --profile version-test up --abort-on-container-exit

      - name: Cleanup version file
        run: rm -f docker-compose.v${{ matrix.compose-version }}.yml

  # Docker Compose with service dependencies
  docker-compose-dependencies:
    name: Docker Compose Service Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create compose file with dependencies
        run: |
          cat > docker-compose.deps.yml << 'EOF'
          version: '3.8'
          services:
            base-service:
              build:
                context: .
                dockerfile: Dockerfile.python
              profiles:
                - deps
            dependent-service:
              build:
                context: .
                dockerfile: Dockerfile.rust
              depends_on:
                - base-service
              profiles:
                - deps
          EOF

      - name: Test service dependencies
        run: |
          docker-compose -f docker-compose.deps.yml --profile deps build
          docker-compose -f docker-compose.deps.yml --profile deps up --abort-on-container-exit

      - name: Cleanup deps file
        run: rm -f docker-compose.deps.yml

  # Docker Compose with restart policies
  docker-compose-restart-policies:
    name: Docker Compose Restart Policies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        restart-policy: [no, always, on-failure, unless-stopped]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create compose file with restart policy
        run: |
          cat > docker-compose.restart.yml << 'EOF'
          version: '3.8'
          services:
            restart-test:
              build:
                context: .
                dockerfile: Dockerfile.python
              restart: ${{ matrix.restart-policy }}
              profiles:
                - restart
          EOF

      - name: Test restart policy
        run: |
          docker-compose -f docker-compose.restart.yml --profile restart build
          docker-compose -f docker-compose.restart.yml --profile restart up --abort-on-container-exit

      - name: Cleanup restart file
        run: rm -f docker-compose.restart.yml

  # Docker Compose with logging configurations
  docker-compose-logging:
    name: Docker Compose Logging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create compose file with logging
        run: |
          cat > docker-compose.logging.yml << 'EOF'
          version: '3.8'
          services:
            logging-test:
              build:
                context: .
                dockerfile: Dockerfile.python
              logging:
                driver: "json-file"
                options:
                  max-size: "10m"
                  max-file: "3"
              profiles:
                - logging
          EOF

      - name: Test logging configuration
        run: |
          docker-compose -f docker-compose.logging.yml --profile logging build
          docker-compose -f docker-compose.logging.yml --profile logging up --abort-on-container-exit

      - name: Cleanup logging file
        run: rm -f docker-compose.logging.yml

  # Docker Compose with user and group
  docker-compose-user-group:
    name: Docker Compose User and Group
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create compose file with user/group
        run: |
          cat > docker-compose.user.yml << 'EOF'
          version: '3.8'
          services:
            user-test:
              build:
                context: .
                dockerfile: Dockerfile.python
              user: "1000:1000"
              profiles:
                - user
          EOF

      - name: Test user/group configuration
        run: |
          docker-compose -f docker-compose.user.yml --profile user build
          docker-compose -f docker-compose.user.yml --profile user up --abort-on-container-exit

      - name: Cleanup user file
        run: rm -f docker-compose.user.yml

  # Docker Compose with working directory
  docker-compose-working-dir:
    name: Docker Compose Working Directory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create compose file with working directory
        run: |
          cat > docker-compose.workdir.yml << 'EOF'
          version: '3.8'
          services:
            workdir-test:
              build:
                context: .
                dockerfile: Dockerfile.python
              working_dir: /custom/workdir
              profiles:
                - workdir
          EOF

      - name: Test working directory
        run: |
          docker-compose -f docker-compose.workdir.yml --profile workdir build
          docker-compose -f docker-compose.workdir.yml --profile workdir up --abort-on-container-exit

      - name: Cleanup workdir file
        run: rm -f docker-compose.workdir.yml
