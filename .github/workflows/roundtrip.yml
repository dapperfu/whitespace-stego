name: CLI Roundtrip Interop

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        make install-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rust CLI
      run: |
        cd rust_backend
        cargo build --release

    - name: Install C build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang

    - name: Build C CLI
      run: |
        cd c_backend
        make

    - name: Run roundtrip tests
      run: |
        bash test_roundtrip.sh
        bash test_roundtrip_rust.sh
        bash test_roundtrip_c.sh
        bash test_roundtrip_c_rust.sh 