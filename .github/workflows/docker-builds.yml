name: Docker Builds and Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Run weekly to ensure builds still work
    - cron: '0 2 * * 1'

env:
  DOCKER_BUILDKIT: 1

jobs:
  # Individual Dockerfile builds
  dockerfile-python:
    name: Python Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python Docker image
        run: docker build -f Dockerfile.python -t whitespace-stego-python .

      - name: Test Python Docker image
        run: |
          docker run --rm whitespace-stego-python python -m whitespace_stego.cli --help
          docker run --rm whitespace-stego-python python-stego-help

  dockerfile-rust:
    name: Rust Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust Docker image
        run: docker build -f Dockerfile.rust -t whitespace-stego-rust .

      - name: Test Rust Docker image
        run: |
          docker run --rm whitespace-stego-rust whitespace-stego-rs --help
          docker run --rm whitespace-stego-rust rust-stego-help

  dockerfile-c:
    name: C Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build C Docker image
        run: docker build -f Dockerfile.c -t whitespace-stego-c .

      - name: Test C Docker image
        run: |
          docker run --rm whitespace-stego-c whitespace-stego --help
          docker run --rm whitespace-stego-c c-stego-help

  # Multi-stage Dockerfile builds
  dockerfile-multi-development:
    name: Multi-stage Development
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development stage
        run: docker build --target development -t whitespace-stego-dev .

      - name: Test development stage
        run: |
          docker run --rm whitespace-stego-dev python3 -m whitespace_stego.cli --help
          docker run --rm whitespace-stego-dev ./whitespace-stego-rs --help
          docker run --rm whitespace-stego-dev ./c/bin/whitespace-stego --help

  dockerfile-multi-production:
    name: Multi-stage Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production stage
        run: docker build --target production -t whitespace-stego-prod .

      - name: Test production stage
        run: |
          docker run --rm whitespace-stego-prod python3 -m whitespace_stego.cli --help

  dockerfile-multi-test:
    name: Multi-stage Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test stage
        run: docker build --target test -t whitespace-stego-test .

      - name: Run tests
        run: docker run --rm whitespace-stego-test

  dockerfile-multi-jupyter:
    name: Multi-stage Jupyter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build jupyter stage
        run: docker build --target jupyter -t whitespace-stego-jupyter .

      - name: Test jupyter stage
        run: |
          docker run --rm -d --name jupyter-test -p 8888:8888 whitespace-stego-jupyter
          sleep 10
          docker logs jupyter-test
          docker stop jupyter-test

  # Docker Compose individual profiles
  docker-compose-python:
    name: Docker Compose Python Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test Python profile
        run: |
          docker-compose -f docker-compose.individual.yml --profile python build
          docker-compose -f docker-compose.individual.yml --profile python up --abort-on-container-exit

  docker-compose-rust:
    name: Docker Compose Rust Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test Rust profile
        run: |
          docker-compose -f docker-compose.individual.yml --profile rust build
          docker-compose -f docker-compose.individual.yml --profile rust up --abort-on-container-exit

  docker-compose-c:
    name: Docker Compose C Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test C profile
        run: |
          docker-compose -f docker-compose.individual.yml --profile c build
          docker-compose -f docker-compose.individual.yml --profile c up --abort-on-container-exit

  docker-compose-all:
    name: Docker Compose All Profiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all profiles
        run: |
          docker-compose -f docker-compose.individual.yml --profile all build
          docker-compose -f docker-compose.individual.yml --profile jupyter build
          docker-compose -f docker-compose.individual.yml --profile test build
          docker-compose -f docker-compose.individual.yml --profile compatibility build

      - name: Test all profiles
        run: |
          docker-compose -f docker-compose.individual.yml --profile all up --abort-on-container-exit

  docker-compose-jupyter:
    name: Docker Compose Jupyter Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test Jupyter profile
        run: |
          docker-compose -f docker-compose.individual.yml --profile jupyter build
          docker-compose -f docker-compose.individual.yml --profile jupyter up --abort-on-container-exit

  docker-compose-test:
    name: Docker Compose Test Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test Test profile
        run: |
          docker-compose -f docker-compose.individual.yml --profile test build
          docker-compose -f docker-compose.individual.yml --profile test up --abort-on-container-exit

  docker-compose-compatibility:
    name: Docker Compose Compatibility Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test Compatibility profile
        run: |
          docker-compose -f docker-compose.individual.yml --profile compatibility build
          docker-compose -f docker-compose.individual.yml --profile compatibility up --abort-on-container-exit

  # Main docker-compose.yml profiles
  docker-compose-main-development:
    name: Main Docker Compose Development
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test development profile
        run: |
          docker-compose --profile development build
          docker-compose --profile development up --abort-on-container-exit

  docker-compose-main-jupyter:
    name: Main Docker Compose Jupyter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test jupyter profile
        run: |
          docker-compose --profile jupyter build
          docker-compose --profile jupyter up --abort-on-container-exit

  docker-compose-main-testing:
    name: Main Docker Compose Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test testing profile
        run: |
          docker-compose --profile testing build
          docker-compose --profile testing up --abort-on-container-exit

  docker-compose-main-production:
    name: Main Docker Compose Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test production profile
        run: |
          docker-compose --profile production build
          docker-compose --profile production up --abort-on-container-exit

  docker-compose-main-individual:
    name: Main Docker Compose Individual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test individual profile
        run: |
          docker-compose --profile individual build
          docker-compose --profile individual up --abort-on-container-exit

  # Cross-implementation compatibility tests
  cross-implementation-tests:
    name: Cross-Implementation Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: |
          docker build -f Dockerfile.python -t whitespace-stego-python .
          docker build -f Dockerfile.rust -t whitespace-stego-rust .
          docker build -f Dockerfile.c -t whitespace-stego-c .

      - name: Create test data
        run: |
          echo "Secret message" > test_message.txt
          echo "Hello world" > test_carrier.txt

      - name: Test Python encode -> Rust decode
        run: |
          docker run --rm -v $(pwd):/data whitespace-stego-python \
            python -m whitespace_stego.cli encode \
            --message-file /data/test_message.txt \
            --carrier-file /data/test_carrier.txt \
            --output /data/encoded_python.txt
          
          docker run --rm -v $(pwd):/data whitespace-stego-rust \
            whitespace-stego-rs decode \
            --cf /data/encoded_python.txt \
            -o /data/decoded_rust.txt
          
          diff test_message.txt decoded_rust.txt

      - name: Test Python encode -> C decode
        run: |
          docker run --rm -v $(pwd):/data whitespace-stego-c \
            whitespace-stego decode \
            --carrier-file /data/encoded_python.txt \
            --output /data/decoded_c.txt
          
          diff test_message.txt decoded_c.txt

      - name: Test Rust encode -> Python decode
        run: |
          docker run --rm -v $(pwd):/data whitespace-stego-rust \
            whitespace-stego-rs encode \
            --mf /data/test_message.txt \
            --cf /data/test_carrier.txt \
            -o /data/encoded_rust.txt
          
          docker run --rm -v $(pwd):/data whitespace-stego-python \
            python -m whitespace_stego.cli decode \
            --carrier-file /data/encoded_rust.txt \
            --output /data/decoded_python.txt
          
          diff test_message.txt decoded_python.txt

      - name: Test C encode -> Python decode
        run: |
          docker run --rm -v $(pwd):/data whitespace-stego-c \
            whitespace-stego encode \
            --message-file /data/test_message.txt \
            --carrier-file /data/test_carrier.txt \
            --output /data/encoded_c.txt
          
          docker run --rm -v $(pwd):/data whitespace-stego-python \
            python -m whitespace_stego.cli decode \
            --carrier-file /data/encoded_c.txt \
            --output /data/decoded_python2.txt
          
          diff test_message.txt decoded_python2.txt

      - name: Cleanup test files
        run: |
          rm -f test_message.txt test_carrier.txt encoded_*.txt decoded_*.txt

  # Performance benchmarks
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: |
          docker build -f Dockerfile.python -t whitespace-stego-python .
          docker build -f Dockerfile.rust -t whitespace-stego-rust .
          docker build -f Dockerfile.c -t whitespace-stego-c .

      - name: Generate test data
        run: |
          # Create large test files
          python3 -c "print('A' * 1000)" > large_message.txt
          python3 -c "print('B' * 10000)" > large_carrier.txt

      - name: Benchmark Python implementation
        run: |
          echo "=== Python Performance Benchmark ==="
          time docker run --rm -v $(pwd):/data whitespace-stego-python \
            python -m whitespace_stego.cli encode \
            --message-file /data/large_message.txt \
            --carrier-file /data/large_carrier.txt \
            --output /data/encoded_python.txt

      - name: Benchmark Rust implementation
        run: |
          echo "=== Rust Performance Benchmark ==="
          time docker run --rm -v $(pwd):/data whitespace-stego-rust \
            whitespace-stego-rs encode \
            --mf /data/large_message.txt \
            --cf /data/large_carrier.txt \
            -o /data/encoded_rust.txt

      - name: Benchmark C implementation
        run: |
          echo "=== C Performance Benchmark ==="
          time docker run --rm -v $(pwd):/data whitespace-stego-c \
            whitespace-stego encode \
            --message-file /data/large_message.txt \
            --carrier-file /data/large_carrier.txt \
            --output /data/encoded_c.txt

      - name: Cleanup benchmark files
        run: |
          rm -f large_message.txt large_carrier.txt encoded_*.txt

  # Security and best practices
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images for scanning
        run: |
          docker build -f Dockerfile.python -t whitespace-stego-python .
          docker build -f Dockerfile.rust -t whitespace-stego-rust .
          docker build -f Dockerfile.c -t whitespace-stego-c .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'whitespace-stego-python:latest'
          format: 'sarif'
          output: 'trivy-results-python.sarif'

      - name: Run Trivy vulnerability scanner on Rust image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'whitespace-stego-rust:latest'
          format: 'sarif'
          output: 'trivy-results-rust.sarif'

      - name: Run Trivy vulnerability scanner on C image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'whitespace-stego-c:latest'
          format: 'sarif'
          output: 'trivy-results-c.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-python.sarif'

      - name: Upload Trivy scan results to GitHub Security tab (Rust)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-rust.sarif'

      - name: Upload Trivy scan results to GitHub Security tab (C)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-c.sarif' 