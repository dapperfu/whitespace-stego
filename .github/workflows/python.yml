name: Python

on:
  push:
    paths:
      - 'python/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'python/**'
      - 'tests/**'

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e python/
          pip install pytest
      - name: Run tests
        run: .venv/bin/pytest tests/