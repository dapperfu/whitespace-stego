name: 01 Make Venv

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  make-venv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Run make venv
        run: make venv

      - name: Verify venv exists
        run: |
          if [ ! -d ".venv" ]; then
            echo "❌ Virtual environment not created"
            exit 1
          fi
          echo "✅ Virtual environment created successfully"

      - name: Upload venv as artifact
        uses: actions/upload-artifact@v4
        with:
          name: venv
          path: .venv/
          retention-days: 1 