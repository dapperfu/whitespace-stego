name: Docker Language Permutations and Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly for comprehensive testing
    - cron: '0 4 * * 1'

env:
  DOCKER_BUILDKIT: 1

jobs:
  # Language-specific permutation tests
  python-backend-permutations:
    name: Python Backend Permutations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [python, rust, c]
        operation: [encode, decode]
        input-type: [file, string]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python image
        run: docker build -f Dockerfile.python -t whitespace-stego-python .

      - name: Create test data
        run: |
          mkdir -p test-data
          echo "Secret message ${{ matrix.backend }} ${{ matrix.operation }}" > test-data/message.txt
          echo "Carrier text for ${{ matrix.backend }} backend" > test-data/carrier.txt

      - name: Test Python with ${{ matrix.backend }} backend
        run: |
          if [ "${{ matrix.input-type }}" = "file" ]; then
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-python \
              python -m whitespace_stego.cli ${{ matrix.operation }} \
              --backend ${{ matrix.backend }} \
              --message-file /app/data/message.txt \
              --carrier-file /app/data/carrier.txt \
              --output /app/data/output_${{ matrix.backend }}_${{ matrix.operation }}.txt
          else
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-python \
              python -m whitespace_stego.cli ${{ matrix.operation }} \
              --backend ${{ matrix.backend }} \
              --message "Secret message ${{ matrix.backend }} ${{ matrix.operation }}" \
              --carrier "Carrier text for ${{ matrix.backend }} backend" \
              --output /app/data/output_${{ matrix.backend }}_${{ matrix.operation }}.txt
          fi

      - name: Verify output
        run: |
          if [ "${{ matrix.operation }}" = "encode" ]; then
            test -f test-data/output_${{ matrix.backend }}_${{ matrix.operation }}.txt
          fi

      - name: Cleanup
        run: rm -rf test-data

  # Rust CLI permutations
  rust-cli-permutations:
    name: Rust CLI Permutations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        operation: [encode, decode]
        input-type: [file, string]
        output-format: [text, binary]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust image
        run: docker build -f Dockerfile.rust -t whitespace-stego-rust .

      - name: Create test data
        run: |
          mkdir -p test-data
          echo "Rust test message ${{ matrix.operation }}" > test-data/message.txt
          echo "Rust carrier text" > test-data/carrier.txt

      - name: Test Rust CLI
        run: |
          if [ "${{ matrix.input-type }}" = "file" ]; then
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-rust \
              whitespace-stego-rs ${{ matrix.operation }} \
              --mf /app/data/message.txt \
              --cf /app/data/carrier.txt \
              -o /app/data/rust_output_${{ matrix.operation }}.txt
          else
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-rust \
              whitespace-stego-rs ${{ matrix.operation }} \
              -m "Rust test message ${{ matrix.operation }}" \
              -c "Rust carrier text" \
              -o /app/data/rust_output_${{ matrix.operation }}.txt
          fi

      - name: Verify output
        run: |
          if [ "${{ matrix.operation }}" = "encode" ]; then
            test -f test-data/rust_output_${{ matrix.operation }}.txt
          fi

      - name: Cleanup
        run: rm -rf test-data

  # C CLI permutations
  c-cli-permutations:
    name: C CLI Permutations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        operation: [encode, decode]
        verbose: [true, false]
        input-type: [file, string]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build C image
        run: docker build -f Dockerfile.c -t whitespace-stego-c .

      - name: Create test data
        run: |
          mkdir -p test-data
          echo "C test message ${{ matrix.operation }}" > test-data/message.txt
          echo "C carrier text" > test-data/carrier.txt

      - name: Test C CLI
        run: |
          if [ "${{ matrix.verbose }}" = "true" ]; then
            VERBOSE_FLAG="--verbose"
          else
            VERBOSE_FLAG=""
          fi
          
          if [ "${{ matrix.input-type }}" = "file" ]; then
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-c \
              whitespace-stego $VERBOSE_FLAG ${{ matrix.operation }} \
              --message-file /app/data/message.txt \
              --carrier-file /app/data/carrier.txt \
              --output /app/data/c_output_${{ matrix.operation }}.txt
          else
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-c \
              whitespace-stego $VERBOSE_FLAG ${{ matrix.operation }} \
              --message "C test message ${{ matrix.operation }}" \
              --carrier "C carrier text" \
              --output /app/data/c_output_${{ matrix.operation }}.txt
          fi

      - name: Verify output
        run: |
          if [ "${{ matrix.operation }}" = "encode" ]; then
            test -f test-data/c_output_${{ matrix.operation }}.txt
          fi

      - name: Cleanup
        run: rm -rf test-data

  # Cross-language integration tests
  cross-language-integration:
    name: Cross-Language Integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        encode-language: [python, rust, c]
        decode-language: [python, rust, c]
        exclude:
          - encode-language: python
            decode-language: python
          - encode-language: rust
            decode-language: rust
          - encode-language: c
            decode-language: c
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: |
          docker build -f Dockerfile.python -t whitespace-stego-python .
          docker build -f Dockerfile.rust -t whitespace-stego-rust .
          docker build -f Dockerfile.c -t whitespace-stego-c .

      - name: Create test data
        run: |
          mkdir -p test-data
          echo "Cross-language test message" > test-data/message.txt
          echo "Cross-language carrier text" > test-data/carrier.txt

      - name: Encode with ${{ matrix.encode-language }}
        run: |
          if [ "${{ matrix.encode-language }}" = "python" ]; then
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-python \
              python -m whitespace_stego.cli encode \
              --message-file /app/data/message.txt \
              --carrier-file /app/data/carrier.txt \
              --output /app/data/encoded_${{ matrix.encode-language }}.txt
          elif [ "${{ matrix.encode-language }}" = "rust" ]; then
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-rust \
              whitespace-stego-rs encode \
              --mf /app/data/message.txt \
              --cf /app/data/carrier.txt \
              -o /app/data/encoded_${{ matrix.encode-language }}.txt
          else
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-c \
              whitespace-stego encode \
              --message-file /app/data/message.txt \
              --carrier-file /app/data/carrier.txt \
              --output /app/data/encoded_${{ matrix.encode-language }}.txt
          fi

      - name: Decode with ${{ matrix.decode-language }}
        run: |
          if [ "${{ matrix.decode-language }}" = "python" ]; then
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-python \
              python -m whitespace_stego.cli decode \
              --carrier-file /app/data/encoded_${{ matrix.encode-language }}.txt \
              --output /app/data/decoded_${{ matrix.decode-language }}.txt
          elif [ "${{ matrix.decode-language }}" = "rust" ]; then
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-rust \
              whitespace-stego-rs decode \
              --cf /app/data/encoded_${{ matrix.encode-language }}.txt \
              -o /app/data/decoded_${{ matrix.decode-language }}.txt
          else
            docker run --rm -v $(pwd)/test-data:/app/data whitespace-stego-c \
              whitespace-stego decode \
              --carrier-file /app/data/encoded_${{ matrix.encode-language }}.txt \
              --output /app/data/decoded_${{ matrix.decode-language }}.txt
          fi

      - name: Verify cross-language compatibility
        run: |
          diff test-data/message.txt test-data/decoded_${{ matrix.decode-language }}.txt

      - name: Cleanup
        run: rm -rf test-data

  # Multi-stage build permutations
  multi-stage-permutations:
    name: Multi-Stage Build Permutations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [development, production, test, jupyter]
        dockerfile: [Dockerfile]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-stage target
        run: |
          docker build --target ${{ matrix.target }} -t whitespace-stego-${{ matrix.target }} .

      - name: Test multi-stage target
        run: |
          if [ "${{ matrix.target }}" = "development" ]; then
            docker run --rm whitespace-stego-${{ matrix.target }} python3 -m whitespace_stego.cli --help
            docker run --rm whitespace-stego-${{ matrix.target }} ./whitespace-stego-rs --help
            docker run --rm whitespace-stego-${{ matrix.target }} ./c/bin/whitespace-stego --help
          elif [ "${{ matrix.target }}" = "production" ]; then
            docker run --rm whitespace-stego-${{ matrix.target }} python3 -m whitespace_stego.cli --help
          elif [ "${{ matrix.target }}" = "test" ]; then
            docker run --rm whitespace-stego-${{ matrix.target }} make test
          elif [ "${{ matrix.target }}" = "jupyter" ]; then
            docker run --rm -d --name jupyter-test -p 8888:8888 whitespace-stego-${{ matrix.target }}
            sleep 10
            docker logs jupyter-test
            docker stop jupyter-test
          fi

  # Docker Compose profile permutations
  docker-compose-profile-permutations:
    name: Docker Compose Profile Permutations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compose-file: [docker-compose.yml, docker-compose.individual.yml]
        profile:
          - python
          - rust
          - c
          - all
          - jupyter
          - test
          - compatibility
          - development
          - testing
          - production
          - individual
        exclude:
          - compose-file: docker-compose.yml
            profile: python
          - compose-file: docker-compose.yml
            profile: rust
          - compose-file: docker-compose.yml
            profile: c
          - compose-file: docker-compose.yml
            profile: all
          - compose-file: docker-compose.yml
            profile: jupyter
          - compose-file: docker-compose.yml
            profile: test
          - compose-file: docker-compose.yml
            profile: compatibility
          - compose-file: docker-compose.individual.yml
            profile: development
          - compose-file: docker-compose.individual.yml
            profile: testing
          - compose-file: docker-compose.individual.yml
            profile: production
          - compose-file: docker-compose.individual.yml
            profile: individual
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build profile
        run: |
          docker-compose -f ${{ matrix.compose-file }} --profile ${{ matrix.profile }} build

      - name: Test profile
        run: |
          docker-compose -f ${{ matrix.compose-file }} --profile ${{ matrix.profile }} up --abort-on-container-exit

  # Docker Compose service permutations
  docker-compose-service-permutations:
    name: Docker Compose Service Permutations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - python-cli
          - rust-cli
          - c-cli
          - dev
          - jupyter
          - test
          - production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test service
        run: |
          docker-compose --profile ${{ matrix.service }} build
          docker-compose --profile ${{ matrix.service }} up --abort-on-container-exit

  # Docker Compose with different environments
  docker-compose-environments:
    name: Docker Compose Environments
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [development, staging, production]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create environment-specific compose file
        run: |
          cat > docker-compose.${{ matrix.environment }}.yml << 'EOF'
          version: '3.8'
          services:
            ${{ matrix.environment }}-service:
              build:
                context: .
                dockerfile: Dockerfile.python
              environment:
                - ENV=${{ matrix.environment }}
                - PYTHONPATH=/app
              profiles:
                - ${{ matrix.environment }}
          EOF

      - name: Build and test environment
        run: |
          docker-compose -f docker-compose.${{ matrix.environment }}.yml --profile ${{ matrix.environment }} build
          docker-compose -f docker-compose.${{ matrix.environment }}.yml --profile ${{ matrix.environment }} up --abort-on-container-exit

      - name: Cleanup environment file
        run: rm -f docker-compose.${{ matrix.environment }}.yml

  # Docker Compose with different architectures
  docker-compose-architectures:
    name: Docker Compose Architectures
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for platform
        run: |
          docker buildx build --platform ${{ matrix.platform }} \
            -f Dockerfile.python \
            -t whitespace-stego-${{ matrix.platform }} .

      - name: Test platform build
        run: |
          docker run --rm --platform ${{ matrix.platform }} whitespace-stego-${{ matrix.platform }} \
            python -m whitespace_stego.cli --help

  # Docker Compose with different base images
  docker-compose-base-images:
    name: Docker Compose Base Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base-image: [python:3.11-slim, python:3.12-slim, ubuntu:22.04]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create base image specific Dockerfile
        run: |
          cat > Dockerfile.${{ matrix.base_image }} << 'EOF'
          FROM ${{ matrix.base_image }}
          
          # Install system dependencies
          RUN apt-get update && apt-get install -y \
              build-essential \
              curl \
              git \
              && rm -rf /var/lib/apt/lists/*
          
          # Install Python if not present
          RUN if ! command -v python3 &> /dev/null; then \
              apt-get update && apt-get install -y python3 python3-pip; \
              fi
          
          WORKDIR /app
          
          # Copy and install Python dependencies
          COPY pyproject.toml requirements-dev.txt ./
          RUN pip3 install --no-cache-dir -r requirements-dev.txt
          RUN pip3 install --no-cache-dir -e .
          
          # Test the installation
          CMD ["python3", "-m", "whitespace_stego.cli", "--help"]
          EOF

      - name: Build with base image
        run: |
          docker build -f Dockerfile.${{ matrix.base_image }} -t whitespace-stego-${{ matrix.base_image }} .

      - name: Test base image build
        run: |
          docker run --rm whitespace-stego-${{ matrix.base_image }}

      - name: Cleanup base image file
        run: rm -f Dockerfile.${{ matrix.base_image }}

  # Docker Compose with different Python versions
  docker-compose-python-versions:
    name: Docker Compose Python Versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11, 3.12]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Python version specific Dockerfile
        run: |
          cat > Dockerfile.python${{ matrix.python-version }}.yml << 'EOF'
          FROM python:${{ matrix.python-version }}-slim
          
          WORKDIR /app
          
          # Copy and install Python dependencies
          COPY pyproject.toml requirements-dev.txt ./
          RUN pip install --no-cache-dir -r requirements-dev.txt
          RUN pip install --no-cache-dir -e .
          
          # Test the installation
          CMD ["python", "-m", "whitespace_stego.cli", "--help"]
          EOF

      - name: Build with Python version
        run: |
          docker build -f Dockerfile.python${{ matrix.python-version }}.yml -t whitespace-stego-python${{ matrix.python-version }} .

      - name: Test Python version build
        run: |
          docker run --rm whitespace-stego-python${{ matrix.python-version }}

      - name: Cleanup Python version file
        run: rm -f Dockerfile.python${{ matrix.python-version }}.yml

  # Docker Compose with different Rust versions
  docker-compose-rust-versions:
    name: Docker Compose Rust Versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: [1.70, 1.75, 1.80]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Rust version specific Dockerfile
        run: |
          cat > Dockerfile.rust${{ matrix.rust-version }}.yml << 'EOF'
          FROM rust:${{ matrix.rust-version }}-slim
          
          WORKDIR /app
          
          # Copy Rust dependencies
          COPY Cargo.toml Cargo.lock ./
          COPY rust/Cargo.toml ./rust/
          COPY src/ ./src/
          
          # Build Rust CLI
          RUN cargo build --release --manifest-path rust/Cargo.toml --target-dir rust/target
          RUN cp rust/target/release/whitespace-stego-rs /usr/local/bin/
          
          # Test the installation
          CMD ["whitespace-stego-rs", "--help"]
          EOF

      - name: Build with Rust version
        run: |
          docker build -f Dockerfile.rust${{ matrix.rust-version }}.yml -t whitespace-stego-rust${{ matrix.rust-version }} .

      - name: Test Rust version build
        run: |
          docker run --rm whitespace-stego-rust${{ matrix.rust-version }}

      - name: Cleanup Rust version file
        run: rm -f Dockerfile.rust${{ matrix.rust-version }}.yml

  # Docker Compose with different GCC versions
  docker-compose-gcc-versions:
    name: Docker Compose GCC Versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gcc-version: [11, 12, 13]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create GCC version specific Dockerfile
        run: |
          cat > Dockerfile.gcc${{ matrix.gcc-version }}.yml << 'EOF'
          FROM gcc:${{ matrix.gcc-version }}-slim
          
          WORKDIR /app
          
          # Copy C source code
          COPY c/ ./c/
          
          # Build C implementation
          RUN cd c && make clean && make
          RUN cp c/bin/whitespace-stego /usr/local/bin/
          
          # Test the installation
          CMD ["whitespace-stego", "--help"]
          EOF

      - name: Build with GCC version
        run: |
          docker build -f Dockerfile.gcc${{ matrix.gcc-version }}.yml -t whitespace-stego-gcc${{ matrix.gcc-version }} .

      - name: Test GCC version build
        run: |
          docker run --rm whitespace-stego-gcc${{ matrix.gcc-version }}

      - name: Cleanup GCC version file
        run: rm -f Dockerfile.gcc${{ matrix.gcc-version }}.yml
