name: 09 Make Python Docker

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  make-python-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Build Docker image
        run: |
          docker build -t whitespace-stego-py-builder .
          echo "✅ Docker image built successfully"

      - name: Test Docker image
        run: |
          # Test that the Docker image works
          docker run --rm whitespace-stego-py-builder python -c "import whitespace_stego; print('✅ Python package imported successfully')"
          
          # Test CLI in Docker
          echo "Hello World" > /tmp/test_message.txt
          echo "This is a carrier file for testing." > /tmp/test_carrier.txt
          
          docker run --rm -v /tmp:/tmp whitespace-stego-py-builder python -m whitespace_stego.cli encode --message-file /tmp/test_message.txt --carrier-file /tmp/test_carrier.txt --output-file /tmp/test_encoded.txt
          docker run --rm -v /tmp:/tmp whitespace-stego-py-builder python -m whitespace_stego.cli decode --carrier-file /tmp/test_encoded.txt --output-file /tmp/test_decoded.txt
          
          echo "Original: $(cat /tmp/test_message.txt)"
          echo "Decoded: $(cat /tmp/test_decoded.txt)"
          
          if diff /tmp/test_message.txt /tmp/test_decoded.txt; then
            echo "✅ Docker test passed"
          else
            echo "❌ Docker test failed"
            exit 1
          fi

      - name: Save Docker image as artifact
        run: |
          # Save the Docker image as a tar file
          docker save whitespace-stego-py-builder -o whitespace-stego-py-builder.tar
          echo "✅ Docker image saved as tar file"

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-docker-image
          path: whitespace-stego-py-builder.tar
          retention-days: 7 