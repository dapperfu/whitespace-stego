version: '3.8'

services:
  # Development environment with all tools
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/workspace
      - cargo-cache:/root/.cargo
      - pip-cache:/root/.cache/pip
    ports:
      - "8888:8888"  # Jupyter
    environment:
      - PYTHONPATH=/workspace
    command: /bin/bash
    profiles:
      - development

  # Jupyter notebook environment
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: jupyter
    volumes:
      - .:/workspace
      - jupyter-data:/root/.jupyter
    ports:
      - "8888:8888"
    environment:
      - PYTHONPATH=/workspace
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    profiles:
      - jupyter

  # Testing environment
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace
    command: make test
    profiles:
      - testing

  # Production-ready container
  production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    volumes:
      - ./data:/home/stego/data
    environment:
      - PYTHONPATH=/usr/local/lib/python3.*/site-packages
    command: /bin/bash
    profiles:
      - production

  # Individual implementation containers
  python-cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./data:/workspace/data
    environment:
      - PYTHONPATH=/workspace
    command: python3 -m whitespace_stego.cli --help
    profiles:
      - individual

  rust-cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./data:/workspace/data
    command: ./whitespace-stego-rs --help
    profiles:
      - individual

  c-cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./data:/workspace/data
    command: ./c/bin/whitespace-stego --help
    profiles:
      - individual

volumes:
  cargo-cache:
  pip-cache:
  jupyter-data: 