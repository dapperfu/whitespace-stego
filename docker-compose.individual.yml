version: '3.8'

services:
  # Python implementation container
  python-stego:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - ./data:/app/data
      - ./tests:/app/tests
    ports:
      - "8888:8888"  # Jupyter notebook
    environment:
      - PYTHONPATH=/app
    profiles:
      - python
      - all

  # Rust implementation container
  rust-stego:
    build:
      context: .
      dockerfile: Dockerfile.rust
    volumes:
      - ./data:/app/data
    environment:
      - RUST_BACKTRACE=1
    profiles:
      - rust
      - all

  # C implementation container
  c-stego:
    build:
      context: .
      dockerfile: Dockerfile.c
    volumes:
      - ./data:/app/data
    profiles:
      - c
      - all

  # Jupyter notebook environment (Python-based)
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - jupyter-data:/root/.jupyter
    ports:
      - "8888:8888"
    environment:
      - PYTHONPATH=/app
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    profiles:
      - jupyter

  # Testing environment (Python-based)
  test:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - ./data:/app/data
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app
    command: pytest -v
    profiles:
      - test

  # Cross-implementation compatibility test
  compatibility-test:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - ./data:/app/data
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app
    command: python test_cli_consistency.py
    profiles:
      - compatibility

volumes:
  jupyter-data: 